```html
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<title>AstraGPT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
    height:100vh;

}

</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">✦ AstraGPT</div>

    <button class="new-chat" onclick="newChat()">
        + Nova conversa
    </button>

    <div class="chat-list" id="chatList"></div>

</aside>

<main class="main">

    <div class="topbar">
        AstraGPT • IA
    </div>

    <div class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h1>✦ Como podemos te ajudar hoje?</h1>
            <p>Pergunta qualquer coisa à AstraGPT.</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input
                id="messageInput"
                placeholder="Mensagem para AstraGPT..."
                autocomplete="off"
            >
            <button id="sendButton">↑</button>
        </div>
    </div>

</main>

<script>
let currentChat = null;

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");

async function loadChats(){
    const response = await fetch("/chats");
    const chats = await response.json();

    const list = document.getElementById("chatList");
    list.innerHTML = "";

    chats.forEach(c => {
        const item = document.createElement("div");

        item.className = "chat-item";
        item.textContent = c.title;

        item.onclick = () => openChat(c.id);

        list.appendChild(item);
    });
}

async function newChat(){
    const response = await fetch("/chat/new", {
        method:"POST"
    });

    const data = await response.json();

    currentChat = data.id;

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>✦ Como podemos te ajudar hoje?</h1>
            <p>Pergunta qualquer coisa à AstraGPT.</p>
        </div>
    `;

    await loadChats();
    input.focus();
}

async function openChat(id){
    currentChat = id;

    const response = await fetch("/chat/" + id);
    const messages = await response.json();

    chat.innerHTML = "";

    messages.forEach(m => {
        addMessage(m.content, m.role);
    });

    input.focus();
}

function addMessage(text, role){
    const message = document.createElement("div");

    message.className =
        "message " + (role === "user" ? "user" : "assistant");

    const content = document.createElement("div");

    content.className = "message-content";

    content.textContent = text;

    message.appendChild(content);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

function showSearching(){
    const div = document.createElement("div");

    div.id = "searching";
    div.className = "searching";

    div.innerHTML = `
        <div class="spinner"></div>
        <span>Pesquisando na Web...</span>
    `;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function hideSearching(){
    const div = document.getElementById("searching");
    if(div) div.remove();
}

function needsSearch(text){
    const words = [
        "pesquisa",
        "pesquisar",
        "pesquisa na web",
        "pesquisa na internet",
        "procura na internet",
        "procura na web"
    ];

    return words.some(w =>
        text.toLowerCase().includes(w)
    );
}

async function sendMessage(){

    const message = input.value.trim();

    if(!message) return;

    if(!currentChat){
        await newChat();
    }

    addMessage(message,"user");

    input.value = "";
    button.disabled = true;

    if(needsSearch(message)){
        showSearching();
    }

    try{

        const response = await fetch(
            "/chat/" + currentChat + "/message",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:message
                })
            }
        );

        const data = await response.json();

        hideSearching();

        if(data.answer){
            addMessage(data.answer,"assistant");
            await loadChats();
        }else{
            addMessage(
                "Erro: " + (data.error || "Erro desconhecido"),
                "assistant"
            );
        }

    }catch(error){

        hideSearching();

        addMessage(
            "Erro de ligação com o servidor.",
            "assistant"
        );
    }

    button.disabled = false;
    input.focus();
}

button.onclick = sendMessage;

input.addEventListener("keydown",e=>{
    if(e.key === "Enter"){
        sendMessage();
    }
});

loadChats();
</script>

</body>
</html>
